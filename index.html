
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>إمساكية رمضان 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Base styles */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      
      .font-amiri {
        font-family: -apple-system, BlinkMacSystemFont, 'Georgia', 'Times New Roman', serif;
        line-height: 1.8;
        font-weight: 600;
      }
      
      .glass-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 215, 0, 0.1);
      }
      
      .gold-text {
        background: linear-gradient(to right, #fbbf24, #d97706);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      /* iOS specific fixes */
      @supports (-webkit-touch-callout: none) {
        html, body {
          font-family: -apple-system, BlinkMacSystemFont, sans-serif !important;
          -webkit-text-size-adjust: 100% !important;
          -ms-text-size-adjust: 100% !important;
        }
        
        .font-amiri {
          font-family: -apple-system, BlinkMacSystemFont, 'Georgia', serif !important;
          font-weight: 600 !important;
        }
        
        /* Force text alignment */
        [class*="text-right"] {
          text-align: right !important;
          direction: rtl !important;
        }
        
        [class*="text-center"] {
          text-align: center !important;
        }
        
        /* Disable problematic font features */
        * {
          font-feature-settings: normal !important;
          -webkit-font-feature-settings: normal !important;
          letter-spacing: normal !important;
          word-spacing: normal !important;
        }
        
        /* Fix iOS Safari specific issues */
        h1, h2, h3, h4, h5, h6 {
          font-weight: 700 !important;
        }
      }
      
      /* Force RTL for all text */
      html[dir="rtl"] * {
        direction: rtl;
        text-align: right;
      }
      
      html[dir="rtl"] .text-center {
        text-align: center;
      }
    </style>
