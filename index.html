
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إمساكية رمضان 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        line-height: 1.6;
      }
      .font-amiri {
        font-family: 'Amiri', 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, serif;
        line-height: 1.8;
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 215, 0, 0.1);
      }
      .gold-text {
        background: linear-gradient(to right, #fbbf24, #d97706);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      /* iOS specific fixes */
      @supports (-webkit-touch-callout: none) {
        body {
          font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
          -webkit-text-size-adjust: 100%;
          -ms-text-size-adjust: 100%;
        }
        .font-amiri {
          font-family: 'Cairo', -apple-system, BlinkMacSystemFont, serif;
          letter-spacing: -0.02em;
        }
        /* Fix Arabic text rendering on iOS */
        * {
          -webkit-font-feature-settings: "kern" 1;
          font-feature-settings: "kern" 1;
        }
        /* Improve text alignment */
        .text-right {
          text-align: right !important;
        }
        .text-center {
          text-align: center !important;
        }
      }
      /* Additional Arabic text fixes */
      .arabic-text {
        direction: rtl;
        unicode-bidi: embed;
        text-align: right;
        font-family: 'Cairo', 'Tajawal', sans-serif;
      }
    </style>
